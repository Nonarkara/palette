name: Decision geometry regression gate
on: [push, pull_request]
permissions: { contents: read }
jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node tools/decision-geometry/verify-source.mjs
      - run: node --test tools/decision-geometry/test.mjs tools/decision-geometry/cli-test.mjs tools/decision-geometry/path-test.mjs
