  <rect x="625" y="40" width="365" height="350" fill="#004958"/>
  <rect x="990" y="40" width="220" height="350" fill="#e1a95f"/>
  <rect x="1210" y="40" width="135" height="350" fill="#ab3b24"/>
  <rect x="1345" y="40" width="215" height="350" fill="#d1b26f"/>
  <text x="40" y="450" fill="#f7f5ef" font-family="Arial, sans-serif" font-size="44" font-weight="700">PALETTE</text>
  <text x="1558" y="450" fill="#f7f5ef" text-anchor="end" font-family="monospace" font-size="18">A ROOM FOR 348 RELATIONSHIPS</text>
