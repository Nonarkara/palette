<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Basics: failing page</title>
<style>
  body { margin: 0; font: 15px/1.4 sans-serif; color: #111; background: #fff; }
  .faint { color: #bbb; }
  a, button { color: #111; text-decoration: none; }
  *:focus { outline: none; }
  .tiny { font-size: 11px; padding: 2px 4px; }
</style>
</head>
<body>
<nav><span>Brand</span> <a class="tiny" href="/a">One</a> <a class="tiny" href="/b">Two</a> <button class="tiny">Go</button></nav>
<p class="faint">This grey line is too faint to read on a phone in the sun.</p>
<img src="dot.svg" width="40" height="40">
<input placeholder="Search">
<button></button>
</body>
</html>
